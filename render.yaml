# Render.com deployment configuration
# Backend: Docker-based Web Service
# Frontend: Deploy as a Static Site separately via Render dashboard
#
# To deploy the frontend on Render as a Static Site:
#   Build Command:  npm install && npm run build
#   Publish Dir:    dist
#   Root Dir:       client
#   Add env var:    VITE_API_URL = https://your-backend-service.onrender.com/api
#                   VITE_SOCKET_URL = https://your-backend-service.onrender.com

services:
  - type: web
    name: portfoliopro-server
    env: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns its own port; this is the internal one
      - key: MONGO_URI
        sync: false           # Set this in Render dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        generateValue: true   # Render will auto-generate a secure value
      - key: CLIENT_ORIGIN
        sync: false           # Set to your Render Static Site URL
    healthCheckPath: /api/health
