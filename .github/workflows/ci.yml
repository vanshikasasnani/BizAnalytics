name: CI — Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    name: Backend Tests (Jest + Supertest)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/portfoliopro_test
      JWT_SECRET: ci_jwt_secret_key_12345
      NODE_ENV: test
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Run backend test suite
        run: npm test
        working-directory: server

  frontend-build:
    name: Frontend Build & Test (Vite + Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Run frontend tests
        run: npm test
        working-directory: client

      - name: Build frontend for production
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_SOCKET_URL: http://localhost:5000

  docker-build:
    name: Docker Compose Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create server .env for Docker
        run: |
          echo "MONGO_URI=mongodb://mongo:27017/portfoliopro" > server/.env
          echo "JWT_SECRET=docker_ci_secret" >> server/.env
          echo "CLIENT_ORIGIN=http://localhost:3000" >> server/.env
          echo "NODE_ENV=production" >> server/.env

      - name: Build Docker images
        run: docker compose build

