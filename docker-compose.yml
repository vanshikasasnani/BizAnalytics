# ── BizAnalytics Docker Compose ──────────────────────────────────────────────
# Usage:
#   1. Copy this file's env section to a .env file (never commit .env)
#   2. docker compose up --build -d
#
# Services:
#   mongo   – MongoDB 7 database with persistent volume
#   server  – Node/Express API + Socket.IO  (port 5000)
#   client  – React SPA served by nginx     (port 3000)
#
# Architecture inside Docker:
#   Browser → nginx:80 (port 3000 on host)
#     ├─ /api/*       → server:5000
#     ├─ /socket.io/* → server:5000
#     └─ /*           → React SPA (index.html)

services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: portfoliopro_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"          # expose so you can still connect locally
    volumes:
      - mongo-data:/data/db    # persistent data survives container restarts
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend (Express + Socket.IO) ──────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfoliopro_server
    restart: unless-stopped
    ports:
      - "5000:5000"            # optional direct access; nginx proxies this internally
    environment:
      PORT: "5000"
      MONGO_URI: "mongodb://mongo:27017/portfoliopro"
      JWT_SECRET: "${JWT_SECRET:-portfoliopro_jwt_secret_key_change_me_in_production}"
      CLIENT_ORIGIN: "http://localhost:3000"
      NODE_ENV: "production"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend (React + Vite → nginx) ────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # In Docker, nginx proxies /api and /socket.io so we use relative paths.
        # The browser sends requests to the SAME origin; nginx routes them.
        VITE_API_URL: "/api"
        VITE_SOCKET_URL: ""
    container_name: portfoliopro_client
    restart: unless-stopped
    ports:
      - "3000:80"              # visit http://localhost:3000
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
